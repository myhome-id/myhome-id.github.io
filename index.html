<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Home — Katalog Inspirasi Outfit</title>
  <style>
    :root {
      --bg: #FAF6F1;
      --card: #FFFFFF;
      --primary: #7C5841;
      --primary-dark: #5D402E;
      --text: #2F2621;
      --muted: #7A6D65;
      --border: #EAE0D5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(47, 38, 33, 0.05);
      margin-bottom: 20px;
    }
    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #F3ECE4;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumbs {
      display: flex;
      gap: 8px;
      padding: 12px 16px 0;
    }
    .thumb-btn {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      border: 2px solid transparent;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      background: #F3ECE4;
    }
    .thumb-btn.active { border-color: var(--primary); }
    .thumb-btn img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 14px 16px 18px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: #F4EDE6;
      padding: 3px 9px;
      border-radius: 99px;
      margin-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--primary);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-dark); }
    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>My Home</h1>
      <p>Katalog Inspirasi Outfit &amp; Rekomendasi Pilihan</p>
    </div>

    <div class="card">
      <a href="https://s.shopee.co.id/6q2ZXpTMJd" target="_blank" rel="noopener noreferrer" class="img-wrap">
        <img id="main-img-1" src="uhmltid-11134207-81ztc-mvd9tkxv17nt9f.jpg" alt="Atasan wanita lengan pendek berkerah V motif leopard" />
      </a>
      <div class="thumbs">
        <button class="thumb-btn active" onclick="gantiFoto('main-img-1', 'uhmltid-11134207-81ztc-mvd9tkxv17nt9f.jpg', this)">
          <img src="uhmltid-11134207-81ztc-mvd9tkxv17nt9f.jpg" alt="Varian 1" />
        </button>
        <button class="thumb-btn" onclick="gantiFoto('main-img-1', '0zxvxid-11134207-81ztq-mvd9tkxuvle11a.jpg', this)">
          <img src="0zxvxid-11134207-81ztq-mvd9tkxuvle11a.jpg" alt="Varian 2" />
        </button>
      </div>
      <div class="card-body">
        <span class="badge">Outfit Pilihan #01</span>
        <h2 class="title">Atasan Wanita Lengan Pendek Berkerah V Motif Leopard Resleting Aktif — Korean Fashion Knit Premium</h2>
        <a href="https://s.shopee.co.id/6q2ZXpTMJd" target="_blank" rel="noopener noreferrer" class="btn">
          Lihat &amp; Beli di Shopee
        </a>
      </div>
    </div>

    <div class="footer">
      &copy; 2026 My Home • Katalog Produk Pilihan
    </div>
  </div>

  <script>
    function gantiFoto(imgId, src, el) {
      document.getElementById(imgId).src = src;
      const buttons = el.parentElement.querySelectorAll('.thumb-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
