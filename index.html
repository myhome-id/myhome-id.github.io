<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Home — Katalog Inspirasi Outfit</title>
  <style>
    :root {
      --bg: #FAF6F1;
      --card: #FFFFFF;
      --primary: #7C5841;
      --primary-dark: #5D402E;
      --text: #2F2621;
      --muted: #7A6D65;
      --border: #EAE0D5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px 48px; }
    .container { max-width: 480px; margin: 0 auto; }
    .profile { text-align: center; margin-bottom: 22px; }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--primary); margin-bottom: 10px;
      background: #E6D8CA;
    }
    .profile h1 { font-size: 20px; font-weight: 700; color: var(--primary-dark); }
    .profile p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .search-box { margin-bottom: 20px; }
    .search-box input {
      width: 100%; padding: 12px 16px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: 14px; color: var(--text); outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 2px 8px rgba(93, 64, 46, 0.05);
    }
    .badge {
      background: var(--primary); color: #FFF; font-size: 11px; font-weight: 600;
      padding: 4px 10px; text-align: center; letter-spacing: 0.4px;
    }
    .thumb {
      width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #EFE7DE;
    }
    .info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .title { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }
    .btn {
      display: block; text-align: center; background: var(--primary); color: #FFF;
      text-decoration: none; font-size: 12px; font-weight: 600;
      padding: 9px 10px; border-radius: 8px;
    }
    .btn:active { background: var(--primary-dark); }
    footer { text-align: center; margin-top: 32px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header class="profile">
      <img class="avatar" src="https://github.com" alt="My Home" />
      <h1>My Home</h1>
      <p>inspirasi outfit nyaman &amp; percaya diri</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari nomor atau nama outfit (misal: 01, blazer)..." onkeyup="filterItems()" />
    </div>

    <main class="grid" id="catalogGrid">
      <!-- ITEM 01 -->
      <article class="item" data-keyword="01 blazer celana kerja">
        <div class="badge">OUTFIT #01</div>
        <img class="thumb" src="https://placehold.co" alt="Outfit 01" />
        <div class="info">
          <div class="title">Setelan Blazer &amp; Celana Lurus Kasual</div>
          <a class="btn" href="https://shopee.co.id" target="_blank" rel="noopener">Lihat Produk</a>
        </div>
      </article>

      <!-- ITEM 02 -->
      <article class="item" data-keyword="02 tunik kulot nyaman">
        <div class="badge">OUTFIT #02</div>
        <img class="thumb" src="https://placehold.co" alt="Outfit 02" />
        <div class="info">
          <div class="title">Tunik Katun Linen &amp; Kulot Highwaist</div>
          <a class="btn" href="https://shopee.co.id" target="_blank" rel="noopener">Lihat Produk</a>
        </div>
      </article>
    </main>

    <footer>
      &copy; 2026 My Home &bull; Katalog Kurasi Outfit
    </footer>
  </div>

  <script>
    function filterItems() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      document.querySelectorAll(".item").forEach(card => {
        const text = (card.innerText + " " + card.dataset.keyword).toLowerCase();
        card.style.display = text.includes(q) ? "flex" : "none";
      });
    }
  </script>
</body>
</html>
